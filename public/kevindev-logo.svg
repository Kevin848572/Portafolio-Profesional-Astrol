<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtro Neón Ultra Brillante -->
    <filter id="kd-neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Filtro de Texto Neón Intenso -->
    <filter id="kd-text-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="tblur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="tblur2" />
      <feMerge>
        <feMergeNode in="tblur2" />
        <feMergeNode in="tblur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .kd-orbit-outer {
      stroke: #00d8ff;
      stroke-width: 5.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#kd-neon-glow);
      opacity: 0.85;
    }
    .kd-orbit-mid {
      stroke: #38bdf8;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .kd-orbit-inner {
      stroke: #ffffff;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.95;
    }
    .kd-text-kevindev {
      font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 64px;
      letter-spacing: 0.08em;
      fill: #ffffff;
      stroke: #00f0ff;
      stroke-width: 1.5px;
      filter: url(#kd-text-glow);
    }
    .kd-text-sub {
      font-family: 'JetBrains Mono', 'Inter', monospace, sans-serif;
      font-weight: 700;
      font-size: 16.5px;
      letter-spacing: 0.22em;
      fill: #38bdf8;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.85));
    }
  </style>

  <!-- 1. ICONO CENTRAL: ÁTOMO REACT + COHETE ASTRO + CÓDIGO AWS -->
  <g transform="translate(300, 145)">
    
    <!-- A. ÓRBITAS DEL ÁTOMO (REACT) - DISTRIBUCIÓN SIMÉTRICA EQUILIBRADA (30°, -30°, 90°) -->
    <g transform="rotate(30)">
      <ellipse cx="0" cy="0" rx="108" ry="38" class="kd-orbit-outer" />
      <ellipse cx="0" cy="0" rx="108" ry="38" class="kd-orbit-mid" />
      <ellipse cx="0" cy="0" rx="108" ry="38" class="kd-orbit-inner" />
    </g>

    <g transform="rotate(-30)">
      <ellipse cx="0" cy="0" rx="108" ry="38" class="kd-orbit-outer" />
      <ellipse cx="0" cy="0" rx="108" ry="38" class="kd-orbit-mid" />
      <ellipse cx="0" cy="0" rx="108" ry="38" class="kd-orbit-inner" />
    </g>

    <g transform="rotate(90)">
      <ellipse cx="0" cy="0" rx="108" ry="38" class="kd-orbit-outer" />
      <ellipse cx="0" cy="0" rx="108" ry="38" class="kd-orbit-mid" />
      <ellipse cx="0" cy="0" rx="108" ry="38" class="kd-orbit-inner" />
    </g>

    <!-- B. NÚCLEO COHETE ASTRO (En el centro exacto del átomo) -->
    <g transform="translate(0, -3)">
      <path d="M 0,-40 L 26,20 L 15,16 L 0,23 L -15,16 L -26,20 Z" fill="rgba(0, 229, 255, 0.16)" />
      
      <path d="M 0,-40 L 26,20 L 15,16 L 0,23 L -15,16 L -26,20 Z" class="kd-orbit-outer" stroke-width="5.5" />
      <path d="M 0,-40 L 26,20 L 15,16 L 0,23 L -15,16 L -26,20 Z" class="kd-orbit-mid" stroke-width="3.2" />
      <path d="M 0,-40 L 26,20 L 15,16 L 0,23 L -15,16 L -26,20 Z" class="kd-orbit-inner" stroke-width="1.4" />

      <path d="M -12,0 L 0,-12 L 12,0" class="kd-orbit-outer" stroke-width="4.5" fill="none" />
      <path d="M -12,0 L 0,-12 L 12,0" class="kd-orbit-mid" stroke-width="2.8" fill="none" />
      <path d="M -12,0 L 0,-12 L 12,0" class="kd-orbit-inner" stroke-width="1.3" fill="none" />
      
      <circle cx="0" cy="8" r="3" fill="#ffffff" filter="url(#kd-neon-glow)" />
    </g>

    <!-- C. AWS CODE TAG < ☁️ > (En la parte inferior derecha, superpuesto fiel a la imagen) -->
    <g transform="translate(68, 50)">
      <g>
        <path d="M -24,-20 L -40,0 L -24,20" class="kd-orbit-outer" stroke-width="5.5" fill="none" />
        <path d="M -24,-20 L -40,0 L -24,20" class="kd-orbit-mid" stroke-width="3.2" fill="none" />
        <path d="M -24,-20 L -40,0 L -24,20" class="kd-orbit-inner" stroke-width="1.4" fill="none" />
      </g>

      <g transform="translate(0, 0)">
        <path d="M -15,10 H 15 A 7.5,7.5 0 0,0 20,2 A 9.5,9.5 0 0,0 8,-8 A 12,12 0 0,0 -9,-6 A 8.5,8.5 0 0,0 -15,10 Z" fill="rgba(0, 229, 255, 0.18)" />
        
        <path d="M -15,10 H 15 A 7.5,7.5 0 0,0 20,2 A 9.5,9.5 0 0,0 8,-8 A 12,12 0 0,0 -9,-6 A 8.5,8.5 0 0,0 -15,10 Z" class="kd-orbit-outer" stroke-width="4.8" fill="none" />
        <path d="M -15,10 H 15 A 7.5,7.5 0 0,0 20,2 A 9.5,9.5 0 0,0 8,-8 A 12,12 0 0,0 -9,-6 A 8.5,8.5 0 0,0 -15,10 Z" class="kd-orbit-mid" stroke-width="2.9" fill="none" />
        <path d="M -15,10 H 15 A 7.5,7.5 0 0,0 20,2 A 9.5,9.5 0 0,0 8,-8 A 12,12 0 0,0 -9,-6 A 8.5,8.5 0 0,0 -15,10 Z" class="kd-orbit-inner" stroke-width="1.3" fill="none" />

        <text x="0" y="5.5" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="12.5" fill="#ffffff" filter="url(#kd-text-glow)">A</text>
      </g>

      <g>
        <path d="M 24,-20 L 40,0 L 24,20" class="kd-orbit-outer" stroke-width="5.5" fill="none" />
        <path d="M 24,-20 L 40,0 L 24,20" class="kd-orbit-mid" stroke-width="3.2" fill="none" />
        <path d="M 24,-20 L 40,0 L 24,20" class="kd-orbit-inner" stroke-width="1.4" fill="none" />
      </g>
    </g>

  </g>

  <!-- 2. NOMBRE PRINCIPAL: KEVINDEV -->
  <text x="300" y="335" text-anchor="middle" class="kd-text-kevindev">KEVINDEV</text>

  <!-- 3. SUBTÍTULO: ESPECIALISTA EN ASTRO, REACT & AWS -->
  <text x="300" y="380" text-anchor="middle" class="kd-text-sub">ESPECIALISTA EN ASTRO, REACT &amp; AWS</text>
</svg>
