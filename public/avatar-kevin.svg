<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Recorte circular preciso para el avatar -->
    <clipPath id="avatar-circle">
      <circle cx="50" cy="50" r="47" />
    </clipPath>
    <!-- Gradiente de borde con brillo sutil -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>
    <filter id="ring-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo oscuro -->
  <circle cx="50" cy="50" r="48" fill="#0b1329" />

  <!-- Foto de Kevin en SVG con recorte circular encuadrada de forma natural -->
  <g clip-path="url(#avatar-circle)">
    <image href="/foto_mia.png" x="-10" y="-12" width="120" height="135" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- Anillo exterior con brillo idéntico a la maqueta -->
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="url(#ring-grad)" stroke-width="2.5" filter="url(#ring-glow)" />
</svg>
